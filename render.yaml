# Render blueprint — a free, public demo of Lectern.
#
# Render's free tier is the shape this file is written for, and the shape matters:
#
#   512 MB RAM        so the image is built WITHOUT PyTorch (EXTRAS=""). Document upload
#                     and semantic search report themselves as unavailable in the UI
#                     rather than failing; generation from a topic and every export
#                     format work normally.
#   No GPU            so there is no local model. The app talks to a free hosted
#                     OpenAI-compatible endpoint instead — see LECTERN_LLM_BASE_URL below.
#   Ephemeral disk    uploads, exports and the SQLite database are wiped on every restart
#                     and every deploy. Fine for a demo; not where a teacher keeps a
#                     term's work. For that, self-host (see the README).
#   Sleeps when idle  the first request after 15 quiet minutes takes about a minute while
#                     the container wakes.
#
# Deploy: push this repo to GitHub, then New > Blueprint on render.com and point it here.
# Set LECTERN_LLM_API_KEY in the Render dashboard; never commit a key.

services:
  - type: web
    name: lectern
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # The lite image. A full build needs ~5 GB and will not fit the free plan.
    dockerBuildArgs:
      EXTRAS: ""
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # ---- where the model lives -------------------------------------------------
      # No GPU here, so point at a hosted OpenAI-compatible endpoint. Groq's free tier
      # needs no card and is markedly faster than a local 8B model. Alternatives that
      # also speak this protocol: OpenRouter, Mistral, Google's OpenAI-compat endpoint.
      - key: LECTERN_LLM_PROVIDER
        value: openai_compat
      - key: LECTERN_LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LECTERN_LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LECTERN_LLM_API_KEY
        sync: false # set it in the dashboard; it must never live in git

      # ---- sized for a small, shared box ----------------------------------------
      # NUM_CTX and AUTO_CONTEXT are read only by the Ollama provider — they size a model
      # that is being loaded into VRAM, and nothing here loads one. They are set anyway so
      # the Settings page reports a figure rather than a default that means nothing.
      #
      # The limit that actually bites on a free key is tokens per minute. Groq's free tier
      # allows 8,000 TPM and 200,000 per day, so one question paper — about twenty calls —
      # will be rate-limited partway through and will finish slowly rather than fail: a 429
      # carries the reset time and the retry loop waits exactly that long. Budget roughly
      # ten papers a day from one free key, and expect a paper to take minutes, not seconds.
      - key: LECTERN_LLM_NUM_CTX
        value: "16384"
      - key: LECTERN_LLM_AUTO_CONTEXT
        value: "false"
      # Generous, because a rate-limited call waits out the limiter's window before it
      # retries. A short timeout here would turn "slow" into "failed".
      - key: LECTERN_LLM_TIMEOUT
        value: "300"
      # One worker: two generations at once would exhaust 512 MB.
      - key: LECTERN_WORKER_CONCURRENCY
        value: "1"
      # No PyTorch in the lite image, so embeddings cannot run at all. Stated
      # explicitly rather than left to detection.
      - key: LECTERN_EMBED_DEVICE
        value: cpu
      - key: LECTERN_OCR_ENABLED
        value: "false"
      - key: LECTERN_MAX_UPLOAD_MB
        value: "10"

      # ---- paths and origins -----------------------------------------------------
      - key: LECTERN_DATA_DIR
        value: /data
      - key: LECTERN_DATABASE_URL
        value: sqlite+aiosqlite:////data/lectern.db
      # The UI is served from the same origin as the API, so no cross-origin access is
      # needed. Left empty deliberately: a public demo should not accept requests from
      # arbitrary sites.
      - key: LECTERN_CORS_ORIGINS
        value: ""
