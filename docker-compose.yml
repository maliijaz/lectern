# Two ways to run this:
#
#   docker compose up
#       The app alone. Point it at an Ollama you already run on the host, or at any
#       OpenAI-compatible endpoint, from the Settings page.
#
#   docker compose --profile with-ollama up
#       The app plus its own Ollama container. Self-contained, but you must pull a model
#       into it once:  docker compose exec ollama ollama pull qwen3:8b

services:
  app:
    build: .
    image: lectern:latest
    ports:
      - "8000:8000"
    volumes:
      # Everything the teacher owns — uploads, parsed text, the search index, exports and
      # the database — lives here. Back this up; the rest is disposable.
      - teacher-data:/data
    environment:
      LECTERN_DATA_DIR: /data
      LECTERN_DATABASE_URL: sqlite+aiosqlite:////data/lectern.db
      LECTERN_LLM_PROVIDER: ${LECTERN_LLM_PROVIDER:-ollama}
      # host.docker.internal reaches an Ollama running on the host machine.
      LECTERN_LLM_BASE_URL: ${LECTERN_LLM_BASE_URL:-http://host.docker.internal:11434}
      LECTERN_LLM_MODEL: ${LECTERN_LLM_MODEL:-qwen3:8b}
      LECTERN_LLM_TIMEOUT: ${LECTERN_LLM_TIMEOUT:-900}
      LECTERN_WORKER_CONCURRENCY: ${LECTERN_WORKER_CONCURRENCY:-2}
      LECTERN_CORS_ORIGINS: http://localhost:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ollama:
    profiles: ["with-ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # Uncomment to use an NVIDIA GPU — roughly ten times faster than CPU for generation.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  teacher-data:
  ollama-models:
